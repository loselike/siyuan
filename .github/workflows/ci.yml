name: Sunny CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sunny-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affected:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Select and execute affected validation
        env:
          SIYUAN_CI_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD^' }}
        run: node scripts/ci-affected.mjs --execute --base "$SIYUAN_CI_BASE" --timings "$RUNNER_TEMP/siyuan-ci-affected-timings.json"
      - name: Upload timing evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: affected-validation-${{ github.sha }}
          path: ${{ runner.temp }}/siyuan-ci-affected-timings.json
          if-no-files-found: error
          retention-days: 14

  image-api:
    needs: affected
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Verify API image policy
        run: bash scripts/api-image-policy.test.sh
      - name: Login to GHCR on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        name: Build API immutable image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.api
          target: runner
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/siyuan-api:git-${{ github.sha }}
          cache-from: type=gha,scope=siyuan-api-runner
          cache-to: type=gha,mode=max,scope=siyuan-api-runner
          provenance: true
          sbom: true
      - name: Write API image metadata
        if: always()
        env:
          API_IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          API_IMAGE_METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          mkdir -p "$RUNNER_TEMP/siyuan-api-image"
          {
            printf 'GIT_COMMIT=%s\n' "$GITHUB_SHA"
            printf 'API_IMAGE_DIGEST=%s\n' "$API_IMAGE_DIGEST"
            printf 'API_IMAGE_METADATA_JSON=%s\n' "$API_IMAGE_METADATA"
          } > "$RUNNER_TEMP/siyuan-api-image/metadata.env"
      - name: Upload API image metadata
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-image-metadata-${{ github.sha }}
          path: ${{ runner.temp }}/siyuan-api-image/metadata.env
          if-no-files-found: error
          retention-days: 30

  image-migrate:
    needs: affected
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        name: Build migration immutable image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.api
          target: prisma-runner
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/siyuan-db-migrate:git-${{ github.sha }}
          cache-from: type=gha,scope=siyuan-api-migrate
          cache-to: type=gha,mode=max,scope=siyuan-api-migrate
          provenance: true
          sbom: true

  image-web:
    needs: affected
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        name: Build Web immutable image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.web
          target: runner
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_RELEASE_ID=git-${{ github.sha }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository_owner }}/siyuan-web:git-${{ github.sha }}
          cache-from: type=gha,scope=siyuan-web
          cache-to: type=gha,mode=max,scope=siyuan-web
          provenance: true
          sbom: true

  release-manifest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [image-api, image-migrate, image-web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write immutable release manifest
        env:
          API_DIGEST: ${{ needs.image-api.outputs.digest }}
          MIGRATE_DIGEST: ${{ needs.image-migrate.outputs.digest }}
          WEB_DIGEST: ${{ needs.image-web.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/siyuan-release"
          {
            printf 'FORMAT_VERSION=1\n'
            printf 'GIT_COMMIT=%s\n' "$GITHUB_SHA"
            printf 'API_IMAGE=ghcr.io/%s/siyuan-api@%s\n' "$GITHUB_REPOSITORY_OWNER" "$API_DIGEST"
            printf 'MIGRATE_IMAGE=ghcr.io/%s/siyuan-db-migrate@%s\n' "$GITHUB_REPOSITORY_OWNER" "$MIGRATE_DIGEST"
            printf 'WEB_IMAGE=ghcr.io/%s/siyuan-web@%s\n' "$GITHUB_REPOSITORY_OWNER" "$WEB_DIGEST"
          } > "$RUNNER_TEMP/siyuan-release/images.env"
      - name: Upload immutable image manifest
        uses: actions/upload-artifact@v7
        with:
          name: release-images-${{ github.sha }}
          path: ${{ runner.temp }}/siyuan-release/images.env
          if-no-files-found: error
          retention-days: 30
