services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: /api
    depends_on:
      - api
    ports:
      - "${APP_PORT:-8899}:80"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      API_PORT: 3001
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be provided in .env}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be provided in .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:-}
      SILICONFLOW_BASE_URL: ${SILICONFLOW_BASE_URL:-https://api.siliconflow.cn/v1}
      SILICONFLOW_MODEL: ${SILICONFLOW_MODEL:-Qwen/Qwen2.5-7B-Instruct}
      USE_PRISMA_REPOSITORY: ${USE_PRISMA_REPOSITORY:-true}
      SEED_ON_EMPTY: ${SEED_ON_EMPTY:-true}
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile.api
      target: prisma-runner
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be provided in .env}
    depends_on:
      - postgres
    profiles:
      - tools
    restart: "no"

  postgres:
    image: docker.m.daocloud.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: siyuan
      POSTGRES_USER: siyuan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
